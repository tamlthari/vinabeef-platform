server:
  port: 8080

spring:
  application:
    name: farm-management
  datasource:
    url: jdbc:postgresql://localhost:5433/vinabeef_db
    username: vinabeef_user
    password: vinabeef_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true        # <--- Allows Flyway to run version 3 even though version 4 was already applied
    validate-on-migrate: true

vinabeef:
  ingestion:
    # TOGGLE: "python-adapter" OR "direct-mqtt"
    mode: python-adapter
    safetrust:
      broker-url: wss://sensor.demo.safetrust.com:443/mqtt
      device-key: "728589"
      company-key: "475"
      token: "eyJhbGciOiJIUzUxMiJ9..QA55Xkun-a75Dr3Rq_F-fJhXSQNkIP8jLwO7rbSG2vxnL34jOOgdtoScSxpStI2SK73v8MXm8LH3sYgzRXJdtA"
  # Calendar day used for "today" (IN/OUT today, reports, dashboard). Gate passes are stored in UTC.
  timezone: ${VINABEEF_TIMEZONE:Asia/Ho_Chi_Minh}

# National Animal Disease Control System (NADCS) delivery of surveillance reports.
#   SIMULATION (default): nothing leaves the server; the log says SIMULATED.
#   LIVE: the report is POSTed to `endpoint` with the key in the `api-key-header` header; the log shows what the agency answered.
# The endpoint and key are server settings only; a request can never change them. Put the key in the environment, not in this file.
# The default endpoint is a PLACEHOLDER: replace it with the URL and credentials the Department of Animal Health gives you.
nadcs:
  mode: ${NADCS_MODE:SIMULATION}
  endpoint: ${NADCS_ENDPOINT:https://api.nadcs.dah.gov.vn/v2/surveillance/herd-health}
  api-key: ${NADCS_API_KEY:}
  api-key-header: ${NADCS_API_KEY_HEADER:X-API-Key}
  timeout-ms: ${NADCS_TIMEOUT_MS:5000}
  # hosts allowed over plain http (testing with scripts/mock_nadcs_server.py): e.g. localhost,127.0.0.1
  insecure-hosts: ${NADCS_INSECURE_HOSTS:}
