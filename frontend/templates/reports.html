{% extends "base.html" %}
{% block header_title %}Reporting{% endblock %}

{% block content %}
<div class="space-y-6">

    <!-- Report Selector Dropdown -->
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5">
        <label class="block text-xs font-bold text-gray-700 mb-2">Select a report</label>
        <div class="relative">
            <select id="report-type-select"
                    onchange="changeReportType(this.value)"
                    class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-800 font-medium bg-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <option value="Information" selected>Information</option>
                <option value="Person Activity">Person Activity</option>
                <option value="Audit">Audit</option>
                <option value="Sensor Report">Sensor Report</option>
            </select>
        </div>
    </div>

    <!-- Filter Configuration Box -->
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded border border-blue-200">Filter</span>
        </div>

        <div class="p-6 space-y-4 text-xs">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <label class="md:col-span-3 text-right font-semibold text-gray-700">Identity Systems (Facility)</label>
                <div class="md:col-span-8">
                    <select id="farm-selector"
                            hx-get="/htmx/report-data"
                            hx-target="#report-data-container"
                            hx-swap="innerHTML"
                            name="farm_id"
                            class="w-full border border-gray-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        {% if user.role in ['EXECUTIVE', 'SYSTEM_ADMIN'] %}
                        <option value="ALL" selected>All Facilities (Executive Overview)</option>
                        {% endif %}
                        <option value="FARM-DAK-LAK">Dak Lak Cattle Station (FARM-DAK-LAK)</option>
                        <option value="FARM-GIA-LAI">Gia Lai Grazing Facility (FARM-GIA-LAI)</option>
                        <option value="FARM-DONG-NAI">Dong Nai Feedlot (FARM-DONG-NAI)</option>
                    </select>
                </div>
                <div class="md:col-span-1 flex items-center space-x-1">
                    <input type="checkbox" id="all-check" class="rounded text-blue-600 focus:ring-0">
                    <label for="all-check" class="text-gray-600 font-semibold">All</label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <label class="md:col-span-3 text-right font-semibold text-gray-700">Sensor</label>
                <div class="md:col-span-8">
                    <input type="text" placeholder="Enter the sensor name"
                           class="w-full border border-gray-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <label class="md:col-span-3 text-right font-semibold text-gray-700">Person</label>
                <div class="md:col-span-8">
                    <input type="text" placeholder="Email or mobile number"
                           class="w-full border border-gray-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center pt-2">
                <label class="md:col-span-3 text-right font-semibold text-gray-700">Timeframe</label>
                <div class="md:col-span-7">
                    <select class="w-full border border-gray-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        <option>The last 2 hours</option>
                        <option>Today (October 17, 2026)</option>
                        <option>The last 7 days</option>
                    </select>
                </div>
                <div class="md:col-span-2 text-right">
                    <button hx-get="/htmx/report-data?farm_id=ALL" hx-target="#report-data-container"
                            class="w-full bg-[#2f80ed] hover:bg-blue-600 text-white font-medium py-2 px-4 rounded text-xs transition shadow-sm">
                        Search
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Dynamic Report Content Area (Cards + Table matching Screenshot 60) -->
    <div id="report-data-container"
         hx-get="/htmx/report-data?farm_id=ALL"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="py-12 text-center text-gray-400 text-xs">Querying report data...</div>
    </div>

</div>

<script>
function changeReportType(val) {
    if (val === 'Audit') {
        window.location.href = '/audit';
    }
}
</script>
{% endblock %}
