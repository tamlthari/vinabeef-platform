{% extends "base.html" %}
{% block header_title %}Audit Trail{% endblock %}

{% block content %}
<div class="space-y-5">

    <form id="audit-form"
          hx-get="/htmx/audit-table"
          hx-target="#audit-table-container"
          hx-swap="innerHTML"
          hx-trigger="submit, change, keyup delay:600ms, every 10s [document.getElementById('audit-live').checked]"
          class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="px-5 py-3 border-b border-gray-100 flex flex-wrap items-center justify-between gap-3">
            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded border border-blue-200">Filter</span>
            <label class="inline-flex items-center gap-2 text-xs text-gray-600">
                <input type="checkbox" id="audit-live" class="rounded text-blue-600 focus:ring-0">
                Refresh every 10 s
            </label>
        </div>
        <div class="p-5 grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Person</label>
                <input type="text" name="actor" placeholder="username"
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Action</label>
                <select name="action" id="audit-action" class="w-full border border-gray-300 rounded px-3 py-2 bg-white focus:outline-none focus:border-blue-500">
                    <option value="">Any action</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Asset type</label>
                <select name="target" id="audit-target" class="w-full border border-gray-300 rounded px-3 py-2 bg-white focus:outline-none focus:border-blue-500">
                    <option value="">Any asset type</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Result</label>
                <select name="outcome" class="w-full border border-gray-300 rounded px-3 py-2 bg-white focus:outline-none focus:border-blue-500">
                    <option value="">Any</option>
                    <option value="SUCCESS">Success</option>
                    <option value="FAILURE">Failure</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Period</label>
                <select name="preset" class="w-full border border-gray-300 rounded px-3 py-2 bg-white focus:outline-none focus:border-blue-500">
                    <option value="today">Today</option>
                    <option value="24h">Last 24 hours</option>
                    <option value="7d" selected>Last 7 days</option>
                    <option value="30d">Last 30 days</option>
                    <option value="all">All time</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">From <span class="font-normal text-gray-400">(replaces Period)</span></label>
                <input type="date" name="from" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">To <span class="font-normal text-gray-400">(inclusive)</span></label>
                <input type="date" name="to" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-[#2f80ed] hover:bg-blue-600 text-white font-medium py-2 px-4 rounded text-xs transition shadow-sm">Search</button>
            </div>
        </div>
    </form>

    <div id="audit-table-container" class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden"
         hx-get="/htmx/audit-table" hx-include="#audit-form" hx-trigger="load" hx-swap="innerHTML">
        <div class="py-12 text-center text-gray-400 text-xs">Loading the audit trail...</div>
    </div>
</div>
{% endblock %}
