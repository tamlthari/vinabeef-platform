version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vinabeef-postgres
    environment:
      POSTGRES_DB: vinabeef_db
      POSTGRES_USER: vinabeef_user
      POSTGRES_PASSWORD: vinabeef_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinabeef_user -d vinabeef_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vinabeef-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  emqx:
    image: emqx/emqx:5.7.0
    container_name: vinabeef-emqx
    ports:
      - "1883:1883"       # MQTT TCP port
      - "8083:8083"       # MQTT over WebSockets
      - "18083:18083"     # EMQX Dashboard (admin/public)
    environment:
      EMQX_NAME: vinabeef_emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin_password
    volumes:
      - emqx_data:/opt/emqx/data

volumes:
  postgres_data:
  redis_data:
  emqx_data: