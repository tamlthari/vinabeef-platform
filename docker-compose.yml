services:
  postgres:
    image: postgres:16-alpine
    container_name: vinabeef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vinabeef_db
      POSTGRES_USER: vinabeef_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-VinaBeefProd2026!}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinabeef_user -d vinabeef_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vinabeef-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: vinabeef-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vinabeef_db
      SPRING_DATASOURCE_USERNAME: vinabeef_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-VinaBeefProd2026!}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # National disease-control reporting (NADCS). Put real values in a `.env` file next to this file (never in git);
      # compose substitutes them here. SIMULATION (default) sends nothing. See HOW-TO-APPLY-6.md / nadcs-mock/README.md.
      NADCS_MODE: ${NADCS_MODE:-SIMULATION}
      NADCS_ENDPOINT: ${NADCS_ENDPOINT:-https://api.nadcs.dah.gov.vn/v2/surveillance/herd-health}
      NADCS_TARGET_URL: ${NADCS_TARGET_URL:-}
      NADCS_API_KEY: ${NADCS_API_KEY:-}
      NADCS_TIMEOUT_MS: ${NADCS_TIMEOUT_MS:-5000}
      NADCS_WARMUP_TIMEOUT_MS: ${NADCS_WARMUP_TIMEOUT_MS:-70000}
      NADCS_BODY_STORE_MAX_CHARS: ${NADCS_BODY_STORE_MAX_CHARS:-2000000}

  frontend:
    build: ./frontend
    container_name: vinabeef-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_BASE_URL: http://backend:8080/api/v1

  caddy:
    image: caddy:2-alpine
    container_name: vinabeef-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: